
name: Update Member Organization Activity

on:
  schedule:
    - cron: "0 1 * * *" # daily at 01:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: org-membership-state
  cancel-in-progress: false

jobs:
  update-org-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Create App token
        id: create_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ORG_MEMBER_TEAM_ADMIN_ID }}
          private-key: ${{ secrets.ORG_MEMBER_TEAM_ADMIN_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Set up GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          gh auth login --with-token <<< "${{ steps.create_token.outputs.token }}"

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ steps.create_token.outputs.token }}

      - name: Update member organization activity
        shell: bash
        run: |
          set -euo pipefail

          ORG="${{ github.repository_owner }}"
          MEMBERS_FILE="org-membership/members.json"
          API_EVENT_WINDOW_DAYS=30

          cutoff="$(date -u -d "$API_EVENT_WINDOW_DAYS days ago" +"%Y-%m-%dT%H:%M:%SZ")"

          if [ ! -f "$MEMBERS_FILE" ]; then
            echo "::error::Members file not found: $MEMBERS_FILE"
            exit 1
          fi

          jq -e '.members | type == "array"' "$MEMBERS_FILE" > /dev/null

          # List all repositories visible to the GitHub App, including private ones.
          repositories_file="$(mktemp)"

          gh api --paginate \
            "/orgs/$ORG/repos?type=all&per_page=100" \
            --jq '.[].full_name' > "$repositories_file"

          mapfile -t repositories < "$repositories_file"

          if [ "${#repositories[@]}" -eq 0 ]; then
            echo "::error::No repositories were returned for $ORG. Check app access."
            exit 1
          fi

          echo "Scanning ${#repositories[@]} repositories in $ORG for activity since $cutoff."

          # JSON Lines: one latest matching event per member per repository.
          repo_events_file="$(mktemp)"
          : > "$repo_events_file"

          for repo in "${repositories[@]}"; do
            echo "Checking $repo"

            if ! gh api "/repos/$repo/events?per_page=100" --paginate --slurp |
              jq -c \
                --slurpfile members "$MEMBERS_FILE" \
                --arg cutoff "$cutoff" \
                --arg repo "$repo" '
                  ($members[0].members
                    | map(select(.status != "nonremovable") | .username | ascii_downcase)
                  ) as $usernames
                  | [
                      .[][]
                      | select(.actor.login? != null and .created_at? != null)
                      | select(.created_at >= $cutoff)
                      | (.actor.login | ascii_downcase) as $login
                      | select($usernames | index($login) != null)
                      | {
                          username: $login,
                          created_at: .created_at,
                          event: .type,
                          repo: $repo
                        }
                    ]
                  | group_by(.username)
                  | map(max_by(.created_at))
                  | .[]
                ' >> "$repo_events_file"; then
              echo "::error::Failed to retrieve or process events for $repo."
              exit 1
            fi
          done

          # Choose the newest event across all repositories for each member.
          # Keep stored timestamps when the discovered event is older or absent.
          updated_file="$(mktemp)"

          jq --slurpfile events "$repo_events_file" '
            ($events
              | group_by(.username)
              | map(max_by(.created_at))
              | INDEX(.username)
            ) as $latest
            | .members |= map(
                (.username | ascii_downcase) as $username
                | $latest[$username] as $event
                | if .status == "nonremovable"
                     or $event == null
                     or $event.created_at <= (.last_org_activity_at // "")
                  then .
                  else
                    .last_org_activity_at = $event.created_at
                    | .last_org_activity_event = $event.event
                    | .last_org_activity_repo = $event.repo
                  end
              )
          ' "$MEMBERS_FILE" > "$updated_file"

          if cmp -s "$MEMBERS_FILE" "$updated_file"; then
            echo "No newer activity found; members.json is unchanged."
          else
            mv "$updated_file" "$MEMBERS_FILE"
            echo "Updated $MEMBERS_FILE with the latest organization activity."
          fi

      - name: Commit and push updated JSON
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Org Event Watcher App"
          git config user.email "${{ vars.ORG_MEMBER_TEAM_ADMIN_ID }}[bot]@users.noreply.github.com"

          git add org-membership/members.json

          if git diff --cached --quiet; then
            echo "No organization activity updates to commit."
          else
            git commit -m "Automated: update member organization activity"
            git push
          fi
