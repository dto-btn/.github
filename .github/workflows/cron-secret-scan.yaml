---
name: Secret scanning

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/trufflehog-knownSecrets.txt"
      - ".github/workflows/cron-secret-scan.yaml"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan default branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run TruffleHog
        shell: bash
        env:
          TRUFFLEHOG_VERSION: "3.99.7@sha256:0d003fc3abc4e1565eca8462b992001314de51451e96e3c44de80d116794d5d1"
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            "ghcr.io/trufflesecurity/trufflehog:${TRUFFLEHOG_VERSION}" \
            git file:///repo \
            --branch HEAD \
            --results=verified,unverified,unknown \
            --no-update \
            --json > "$RUNNER_TEMP/trufflehog.json"

      - name: Evaluate findings
        shell: bash
        run: |
          set -euo pipefail

          failed=0
          knownSecrets=".github/trufflehog-knownSecrets.txt"
          findings="$RUNNER_TEMP/trufflehog-findings.txt"

          jq -r '.SourceMetadata.Data.Git | "\(.commit)|\(.file)"' \
            "$RUNNER_TEMP/trufflehog.json" > "$findings"

          while IFS= read -r finding; do
            if ! grep -Fxq -- "$finding" "$knownSecrets"; then
              echo "::error::Unapproved secret: $finding"
              failed=1
            fi
          done < "$findings"

          if (( failed )); then
            echo "New secrets detected."
            exit 1
          fi
