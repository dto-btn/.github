
---
name: Code Quality

on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Remove previous Super-linter PR comments
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Looking for previous Super-linter comments on PR #${PR_NUMBER}"

          comment_ids="$(
            gh api \
              "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              --paginate \
              --jq '.[]
                | select(.user.type == "Bot")
                | select(.body | contains("Powered by [Super-linter]"))
                | .id'
          )"

          if [ -z "${comment_ids}" ]; then
            echo "No previous Super-linter comments found."
            exit 0
          fi

          echo "${comment_ids}" | while read -r comment_id; do
            [ -z "${comment_id}" ] && continue

            echo "Deleting Super-linter comment ${comment_id}"

            gh api \
              --method DELETE \
              "repos/${REPO}/issues/comments/${comment_id}"
          done

      - name: Super-linter
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_CHECKOV: false
          VALIDATE_JSCPD: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_TRIVY: false
          SUPPRESS_POSSUM: true
          LINTER_RULES_PATH: .
          DISABLE_ERRORS: true
          SAVE_SUPER_LINTER_SUMMARY: true
          FAIL_ON_INVALID_GITHUB_ACTIONS_EVENT_CONFIGURATION: true
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          UPDATE_EXISTING_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          MULTI_STATUS: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: true

          NO_COLOR: "1"
          FORCE_COLOR: "0"
          TERM: dumb
